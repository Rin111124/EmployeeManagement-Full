name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  admin-backend:
    name: Admin backend tests + coverage
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Backup archive tests
        run: npm run test:backup
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-report
          path: packages/backend/coverage/
          retention-days: 14
      - run: npm run security:test
        env:
          SECURITY_ENV_STRICT: 'true'
          JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000

  attendance-service:
    name: Attendance service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance/attendance-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance/attendance-service/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          SYNC_SECRET: ci-sync-secret-value-at-least-32-characters
          ADMIN_URL: http://localhost:5000/api/v1

  frontend:
    name: Admin frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile storage tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance/mobile-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance/mobile-app/package-lock.json
      - run: npm ci
      - run: npm run lint

  ai-service:
    name: AI service tests & edge cases
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance/ai-service
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python -m unittest test_ai_service.py

  e2e:
    name: Playwright E2E tests
    needs: [admin-backend, frontend]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/frontend/package-lock.json
            packages/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: packages/backend
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
      - name: Seed Database for E2E Tests
        working-directory: packages/backend
        run: npm run seed:demo
        env:
          ADMIN_PASSWORD: Admin@123456
          MONGODB_URI: mongodb://127.0.0.1:27017/employee_management
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/employee_management
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000

  security-scan:
    name: Security vulnerability & secret scan + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy vulnerability & secret scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          security-checks: 'vuln,secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'table'
      - name: Generate SBOM (SPDX JSON format)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

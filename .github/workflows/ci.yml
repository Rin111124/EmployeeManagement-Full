name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  admin-backend:
    name: Admin backend tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-system/backend
    steps:
      # P1-DEP-05: Pinned to SHA to prevent supply chain attacks
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-system/backend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        # P1-DEP-05: Pinned to SHA
        uses: actions/upload-artifact@65462800fd760344b1a7b4ebb4581c8ba4b310cc # v4
        with:
          name: backend-coverage-report
          path: admin-system/backend/coverage/
          retention-days: 14
      - run: npm run security:test
        env:
          SECURITY_ENV_STRICT: 'true'
          JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000

  attendance-service:
    name: Attendance service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance-system/attendance-service
    steps:
      # P1-DEP-05: Pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance-system/attendance-service/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Admin frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-system/frontend
    steps:
      # P1-DEP-05: Pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-system/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance-system/mobile-app
    steps:
      # P1-DEP-05: Pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance-system/mobile-app/package-lock.json
      - run: npm ci
      - run: npm run lint

  ai-service:
    name: AI service tests & edge cases
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance-system/ai-service
    steps:
      # P1-DEP-05: Pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python -m unittest test_ai_service.py

  e2e:
    name: Playwright E2E tests
    needs: [admin-backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-system/frontend
    steps:
      # P1-DEP-05: Pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-system/frontend/package-lock.json
            admin-system/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: admin-system/backend
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'
          JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000

  security-scan:
    name: Security vulnerability scan
    runs-on: ubuntu-latest
    steps:
      # P1-DEP-05: Pinned to SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Run Trivy vulnerability scanner
        # aquasecurity/trivy-action@0.28.0 = 18f2a2dc4a7c7b966f6d11c1f4c1f78395ead74e
        # IMPORTANT: Do NOT use @master — always pin to a release SHA
        uses: aquasecurity/trivy-action@18f2a2dc4a7c7b966f6d11c1f4c1f78395ead74e # 0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'


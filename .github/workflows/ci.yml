name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  admin-backend:
    name: Admin backend tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-system/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-system/backend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: admin-system/backend/coverage/
          retention-days: 14
      - run: npm run security:test
        env:
          SECURITY_ENV_STRICT: 'true'
          JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000

  attendance-service:
    name: Attendance service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance-system/attendance-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance-system/attendance-service/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          SYNC_SECRET: ci-sync-secret-value-at-least-32-characters
          ADMIN_URL: http://localhost:5000/api/v1

  frontend:
    name: Admin frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-system/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance-system/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendance-system/mobile-app/package-lock.json
      - run: npm ci
      - run: npm run lint

  ai-service:
    name: AI service tests & edge cases
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: attendance-system/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python -m unittest test_ai_service.py

  e2e:
    name: Playwright E2E tests
    needs: [admin-backend, frontend]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    defaults:
      run:
        working-directory: admin-system/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            admin-system/frontend/package-lock.json
            admin-system/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: admin-system/backend
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci
      - name: Seed Database for E2E Tests
        working-directory: admin-system/backend
        run: npm run seed:demo
        env:
          ADMIN_PASSWORD: Admin@123456
          MONGODB_URI: mongodb://127.0.0.1:27017/employee_management
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: 'true'
          MONGODB_URI: mongodb://127.0.0.1:27017/employee_management
          REDIS_URL: redis://127.0.0.1:6379
          JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters
          CORS_ORIGIN: http://localhost:3000

  security-scan:
    name: Security vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'table'
